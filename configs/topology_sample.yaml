        category: "network"
      - name: "OpenResty"
        version: "1.21"
        category: "compute"
      - name: "Lua"
        version: "5.1"
        category: "compute"
    slo:
      availability_target: 0.9999
      latency_p99_ms: 50
      throughput_rps: 10000
    dependencies:
      - target: "auth-service"
        traffic_percentage: 100.0
        critical: true
      - target: "rate-limiter"
        traffic_percentage: 100.0
        critical: true
      - target: "user-service"
        traffic_percentage: 80.0
